# auth 모듈 설정 — 소유: 임승현 (PRD §9.2)
#
# 여기에는 gachiga.auth.* 아래에만 쓴다. application.yml 에는 쓰지 않는다 (CLAUDE.md §5).
# 예정 항목: JWT 만료 시간, 허용 웹메일 도메인, spring.mail.*, gachiga.chat.* 등
#
# application.yml 의 spring.config.import 가 이 파일을 optional 로 읽는다.
# 아직 넣을 값이 없어 비어 있다 — 값을 추가할 때 아래 주석을 지우고 쓰면 된다.
#
# gachiga:
#   auth:
#     some-key: value
