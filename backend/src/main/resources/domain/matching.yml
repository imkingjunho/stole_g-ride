# matching 모듈 설정 — 소유: 서준 (PRD §9.2)
#
# 여기에는 gachiga.matching.* 아래에만 쓴다. application.yml 에는 쓰지 않는다 (CLAUDE.md §5).
# 예정 항목: 매칭 tick 주기, 점수 가중치 w1~w3, 최대 인원, gachiga.fare.* 정산 설정 등
#
# application.yml 의 spring.config.import 가 이 파일을 optional 로 읽는다.
# 아직 넣을 값이 없어 비어 있다 — 값을 추가할 때 아래 주석을 지우고 쓰면 된다.
#
# gachiga:
#   matching:
#     some-key: value
