# 전 프로파일 공통 설정. 환경별 값은 application-{profile}.yml 에 둔다.
spring:
  application:
    name: gachiga
  profiles:
    # 기본은 로컬. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다
    default: local
  # 모듈별 설정은 각 소유자가 자기 파일에만 쓴다 (PRD §9.2).
  # 파일이 없어도 기동되도록 optional 로 둔다 — 아직 안 만든 사람이 있어도 남이 막히지 않는다.
  config:
    import:
      - optional:classpath:domain/ride.yml
      - optional:classpath:domain/matching.yml
      - optional:classpath:domain/auth.yml
      - optional:classpath:domain/route.yml
  jpa:
    hibernate:
      # 엔티티가 곧 스키마다 (PRD §7.3). Flyway 같은 마이그레이션 도구는 쓰지 않는다.
      # 각자 자기 모듈 엔티티만 만들면 테이블이 자동 생성된다.
      # 주의: 컬럼 삭제·이름 변경·타입 변경은 반영되지 않는다. 그런 변경을 했으면 단톡방에 공지하고
      #       전원이 docker compose down -v && docker compose up -d --wait 로 DB 를 초기화한다.
      # 운영(prod)은 validate 로 덮어쓴다 — application-prod.yml 참고.
      ddl-auto: update
    # 트랜잭션 밖 지연 로딩을 막아 N+1 을 조기에 드러낸다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# 브라우저에서 우리 API 를 부를 수 있는 출처.
# REST(config/CorsConfig)와 WebSocket 핸드셰이크(realtime/WebSocketConfig)가 이 한 줄을 함께 읽는다.
# 배포 도메인이 생기면 여기에만 추가하면 둘 다 열린다 (Phase 3 T3-3).
gachiga:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

# 제목·인증 UI 등 상세 설정은 config/SwaggerConfig 에 있다
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
