# 운영 프로파일. 값은 전부 환경변수로 주입한다.
# 기본값을 두지 않으므로 환경변수가 누락되면 미해결 placeholder 가 그대로 전달돼 연결에 실패한다.
# (DB 는 기동 시점에, Redis 는 최초 접속 시점에 드러난다)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: CA 인증서 배포 후 sslMode=VERIFY_CA 로 승격한다 (REQUIRED 는 암호화만 하고 서버 인증서를 검증하지 않음)
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      # 운영에서는 애플리케이션이 스키마를 건드리지 않는다. 구조가 안 맞으면 기동을 거부한다.
      # 스키마는 Phase 3(T3-2)에서 로컬에서 뽑은 docs/schema.sql 로 미리 적용한다 (PRD §7.3).
      ddl-auto: validate
    show-sql: false

server:
  # Caddy(HTTPS 종단) 뒤에서 뜬다. X-Forwarded-Proto/For 를 읽어야 리다이렉트·쿠키(Secure)·로그가 https 기준이 된다.
  # native = Tomcat RemoteIpValve. 사설망(172.16~31·192.168 등) 프록시가 붙인 X-Forwarded-* 만 믿는다.
  # framework(ForwardedHeaderFilter)는 클라이언트가 보낸 RFC 7239 Forwarded·X-Forwarded-Prefix 까지 믿어
  # 리다이렉트 주소를 바꿀 수 있었다 (Caddy 는 그 헤더를 덮어쓰지 않는다) — 그래서 쓰지 않는다.
  forward-headers-strategy: native

# 운영에서는 명세 UI 를 노출하지 않는다
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.gachiga: INFO
