# 로컬 개발 프로파일. docker compose up -d 로 띄운 MySQL/Redis 를 기본값으로 가정한다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gachiga}?connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME:gachiga}
    password: ${DB_PASSWORD:gachiga}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: true

logging:
  level:
    com.gachiga: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
